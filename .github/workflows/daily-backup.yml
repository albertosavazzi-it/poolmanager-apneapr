name: Daily Supabase Backup

on:
  schedule:
    # Esegue il backup ogni notte alle 03:00 UTC (04:00/05:00 ora italiana)
    - cron: '0 3 * * *'
  # Consente di lanciare il backup manualmente da GitHub
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Installa PostgreSQL Client 17
        run: |
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Esegui pg_dump
        run: |
          mkdir -p backups
          DATA=$(date +'%Y-%m-%d_%H-%M')
          pg_dump -v -Fc --no-owner --no-privileges \
            --schema=public \
            --schema=auth \
            "${{ secrets.SUPABASE_DB_URL }}" > "backups/supabase-backup-${DATA}.dump"

      - name: Salva backup negli Artifacts di GitHub
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_number }}
          path: backups/*.dump
          retention-days: 14